<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh; background-color: #f4f4f4;">
  <div style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 320px; text-align: center;">

    <h2 style="color: #ff5722; margin-bottom: 25px; font-family: sans-serif;">Вход в Freaches 🥪</h2>

    <div *ngIf="message"
         style="margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #e8f5e9; color: #2e7d32; text-align: left;">
      {{ message }}
    </div>

    <div *ngIf="error"
         style="margin-bottom: 15px; padding: 10px; border-radius: 8px; background: #ffebee; color: #c62828; text-align: left;">
      {{ error }}
    </div>

    <div style="margin-bottom: 15px;">
      <input
        [(ngModel)]="username"
        placeholder="Логин"
        style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 20px;">
      <input
        [(ngModel)]="password"
        type="password"
        placeholder="Пароль"
        style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; box-sizing: border-box;">
    </div>

    <button
      (click)="login()"
      [disabled]="isLoading"
      style="width: 100%; padding: 12px; background-color: #ff5722; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-bottom: 10px;">
      {{ isLoading ? 'Подожди...' : 'Войти' }}
    </button>

    <button
      (click)="register()"
      [disabled]="isLoading"
      style="width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold;">
      Зарегистрироваться
    </button>

    <p style="margin-top: 20px; font-size: 12px; color: #888;">
      Сначала зарегистрируй нового пользователя, потом войди под ним
    </p>
  </div>
</div>
