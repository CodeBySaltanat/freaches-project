<section class="auth-page">
  <div class="auth-hero">
    <span class="auth-badge">Freaches</span>
    <h1>Один вход — два режима работы</h1>
    <p>
      Покупатель оформляет заказ и отслеживает статус.
      Производитель работает с входящими заказами.
    </p>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button
        type="button"
        [class.active]="mode === 'login'"
        (click)="switchMode('login')"
      >
        Вход
      </button>

      <button
        type="button"
        [class.active]="mode === 'register'"
        (click)="switchMode('register')"
      >
        Регистрация
      </button>
    </div>

    <h2>{{ mode === 'login' ? 'Добро пожаловать' : 'Создание аккаунта' }}</h2>

    <div class="message error" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="message success" *ngIf="successMessage">{{ successMessage }}</div>

    <div class="field">
      <label>Логин</label>
      <input [(ngModel)]="username" placeholder="Например, saltanat" />
    </div>

    <div class="field">
      <label>Пароль</label>
      <input
        [(ngModel)]="password"
        type="password"
        placeholder="Минимум 6 символов"
      />
    </div>

    <div *ngIf="mode === 'register'">
      <div class="field">
        <label>Подтверждение пароля</label>
        <input
          [(ngModel)]="confirmPassword"
          type="password"
          placeholder="Повтори пароль"
        />
      </div>

      <div class="role-picker">
        <button
          type="button"
          [class.selected]="role === 'buyer'"
          (click)="role = 'buyer'"
        >
          Покупатель
        </button>

        <button
          type="button"
          [class.selected]="role === 'producer'"
          (click)="role = 'producer'"
        >
          Производитель
        </button>
      </div>
    </div>

    <button class="primary-btn" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Подожди...' : (mode === 'login' ? 'Войти' : 'Создать аккаунт') }}
    </button>
  </div>
</section>
