<nav style="display:flex; gap:15px; padding:15px; background:#333; align-items: center; color: white;">
  <a routerLink="/menu" style="color: white; text-decoration: none; font-weight: bold;">🍔 Меню</a>
  <a routerLink="/cart" style="color: white; text-decoration: none; font-weight: bold;">🛒 Корзина</a>
  <a routerLink="/orders" style="color: white; text-decoration: none; font-weight: bold;">Заказы</a>

  @if (isLoggedIn()) {
    <a routerLink="/profile" style="color: #4CAF50; text-decoration: none; font-weight: bold;">👤 Профиль</a>
  } @else {
    <a routerLink="/login" style="color: #ff5722; text-decoration: none; font-weight: bold;">🔑 Войти</a>
  }

  @if (isLoggedIn()) {
    <span style="margin-left:auto;">
      <button (click)="logout()" style="background: #ff5722; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;">
        Выйти 🚪
      </button>
    </span>
  }
</nav>

<hr style="margin: 0; border: 0; height: 1px; background: #eee;">

<router-outlet></router-outlet>
